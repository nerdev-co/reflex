services:
  db:
    image: postgres:16-alpine
    container_name: reflex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reflex
      POSTGRES_PASSWORD: reflex
      POSTGRES_DB: reflex
    ports:
      - "5432:5432"
    volumes:
      - reflex-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflex -d reflex"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    image: redis:7-alpine
    container_name: reflex-queue
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - reflex-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reflex-db-data:
  reflex-queue-data:
